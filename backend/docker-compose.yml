services:
  postgres:
    image: postgres:16-alpine
    container_name: ueh-tracker-postgres
    restart: always
    environment:
      POSTGRES_USER: ueh_admin
      POSTGRES_PASSWORD: ueh_secret_password
      POSTGRES_DB: ueh_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ueh_admin -d ueh_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ueh-tracker-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ueh.edu.vn
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
